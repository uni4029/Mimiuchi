name: Mimiuchi
options:
  bundleIdPrefix: local.mimiuchi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
packages:
  PlamoKit:
    path: Packages/PlamoKit
  MimiuchiCore:
    path: Packages/MimiuchiCore
targets:
  Mimiuchi:
    type: application
    platform: macOS
    sources:
      - path: Mimiuchi
        excludes:
          - "Info.plist"
          - "Mimiuchi.entitlements"
      # License texts (PLaMo Community License + open source), shown in Settings > 情報.
      - path: Licenses
        type: folder
        buildPhase: resources
      # Terms of Use shown (and agreed to) on first launch; see Mimiuchi/Views/TermsOfUseView.swift.
      - path: TermsOfUse.md
        buildPhase: resources
    dependencies:
      - package: PlamoKit
        product: PlamoKit
      - package: MimiuchiCore
        product: MimiuchiCore
    info:
      path: Mimiuchi/Info.plist
      properties:
        CFBundleDisplayName: Mimiuchi
        CFBundleName: Mimiuchi
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 uni4029. Built with PLaMo."
        NSPrincipalClass: NSApplication
        NSServices:
          - NSMenuItem:
              default: Mimiuchiで翻訳
            NSMessage: translateSelection
            NSPortName: Mimiuchi
            NSSendTypes: [NSStringPboardType, public.utf8-plain-text]
            NSRequiredContext: {}
    entitlements:
      path: Mimiuchi/Mimiuchi.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.mimiuchi.Mimiuchi
        PRODUCT_NAME: Mimiuchi
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          # XCTest injects into the host app; hardened runtime would block it.
          ENABLE_HARDENED_RUNTIME: NO
          # Own privacy permissions (and settings) for Xcode runs: an ad-hoc signed Debug build
          # asking for permissions must not reset the installed app's Input Monitoring and
          # Accessibility switches.
          PRODUCT_BUNDLE_IDENTIFIER: local.mimiuchi.Mimiuchi.debug
        Release:
          ENABLE_HARDENED_RUNTIME: YES
schemes:
  Mimiuchi:
    build:
      targets:
        Mimiuchi: all
    run:
      config: Debug
    archive:
      config: Release
